name: 'Release Build'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS Compiler
        run: choco install nsis -y

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Build Web Frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://mqktczeqkynqqgzkbrno.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xa3RjemVxa3lucXFnemticm5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMzI3MDUsImV4cCI6MjA5OTkwODcwNX0.vFo6S1aa1Uv2JsleRh50VkoL4aknzjepgUvqOI0frNY

      - name: Build Tauri Desktop Executable (.exe)
        run: npx tauri build --ci
        env:
          VITE_SUPABASE_URL: https://mqktczeqkynqqgzkbrno.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xa3RjemVxa3lucXFnemticm5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMzI3MDUsImV4cCI6MjA5OTkwODcwNX0.vFo6S1aa1Uv2JsleRh50VkoL4aknzjepgUvqOI0frNY

      - name: Publish GitHub Release with .exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Fish House Desktop ${{ github.ref_name || 'v1.0.5' }}
          body: |
            ## ðŸŸ Fish House Desktop - Instalador Windows Oficial
            
            Sistema Completo de GestÃ£o Comercial, Frente de Caixa (PDV), pesagem Toledo MGV 7 e todos os mÃ³dulos para a Peixaria Premium Fish House.
            
            - **Instalador:** Baixe o arquivo `.exe` abaixo para instalar no computador da loja.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

