[package]
name = "fish-house-desktop"
version = "1.0.1"
description = "Fish House Desktop - PDV e Gestao Comercial para Peixaria"
authors = ["Fish House <contato@peixariafishhouse.com.br>"]
edition = "2021"

[lib]
name = "fish_house_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
dirs = "6.0"
